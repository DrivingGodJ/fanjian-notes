<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-label="On-device Fanjian Notes processing pipeline">
  <defs>
    <linearGradient id="wbg-en" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111a15"/>
      <stop offset="100%" stop-color="#17241d"/>
    </linearGradient>
    <linearGradient id="ebeam1" x1="276" y1="153" x2="338" y2="153" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7fa46e"/>
      <stop offset="100%" stop-color="#aec79a"/>
    </linearGradient>
    <linearGradient id="ebeam2" x1="570" y1="153" x2="632" y2="153" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#aec79a"/>
      <stop offset="100%" stop-color="#d2b48c"/>
    </linearGradient>
    <linearGradient id="ebeam3" x1="864" y1="153" x2="926" y2="153" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d2b48c"/>
      <stop offset="100%" stop-color="#cf7661"/>
    </linearGradient>
    <style>
      .serif { font-family: "Songti SC", "STSong", Georgia, "Times New Roman", serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace; }
      .flow { stroke-dasharray: 6 6; animation: dash 1.8s linear infinite; }
      .node-pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="18" fill="url(#wbg-en)" stroke="rgba(174,199,154,0.22)" stroke-width="1.5"/>
  <text x="44" y="42" fill="#95a88d" font-size="12" letter-spacing="2" class="mono">ON-DEVICE PIPELINE · ZERO SERVER UPLOAD</text>
  <text x="1156" y="42" text-anchor="end" fill="#7c9075" font-size="12" class="sans">100% WebAssembly + Web Worker execution</text>

  <g transform="translate(44, 66)">
    <rect x="0" y="0" width="232" height="174" rx="12" fill="#18251d" stroke="rgba(174,199,154,0.26)" stroke-width="1"/>
    <text x="20" y="34" fill="#89a87a" font-size="12" letter-spacing="1.5" class="mono">01 · CAPTURE</text>
    <text x="20" y="72" fill="#eff4ea" font-size="21" class="serif">Capture &amp; Import</text>
    <text x="20" y="106" fill="#a2b39b" font-size="13" class="sans">Native phone camera input</text>
    <text x="20" y="128" fill="#a2b39b" font-size="13" class="sans">Deterministic EXIF decode</text>
    <text x="20" y="156" fill="#6f826a" font-size="11.5" class="mono">Up to 2600px / 6 MP</text>
  </g>

  <line x1="276" y1="153" x2="338" y2="153" stroke="url(#ebeam1)" stroke-width="2.2" class="flow"/>
  <circle cx="307" cy="153" r="4" fill="#aec79a" class="node-pulse"/>

  <g transform="translate(338, 66)">
    <rect x="0" y="0" width="232" height="174" rx="12" fill="#18251d" stroke="rgba(174,199,154,0.26)" stroke-width="1"/>
    <text x="20" y="34" fill="#aec79a" font-size="12" letter-spacing="1.5" class="mono">02 · PREPROCESS</text>
    <text x="20" y="72" fill="#eff4ea" font-size="21" class="serif">Dewarp &amp; Sharpen</text>
    <text x="20" y="106" fill="#a2b39b" font-size="13" class="sans">4-way text upright check</text>
    <text x="20" y="128" fill="#a2b39b" font-size="13" class="sans">UVDoc 3D page flattening</text>
    <text x="20" y="156" fill="#6f826a" font-size="11.5" class="mono">Shadow balance + USM</text>
  </g>

  <line x1="570" y1="153" x2="632" y2="153" stroke="url(#ebeam2)" stroke-width="2.2" class="flow"/>
  <circle cx="601" cy="153" r="4" fill="#d2b48c" class="node-pulse"/>

  <g transform="translate(632, 66)">
    <rect x="0" y="0" width="232" height="174" rx="12" fill="#18251d" stroke="rgba(174,199,154,0.26)" stroke-width="1"/>
    <text x="20" y="34" fill="#d2b48c" font-size="12" letter-spacing="1.5" class="mono">03 · LOCAL OCR</text>
    <text x="20" y="72" fill="#eff4ea" font-size="21" class="serif">Recognize &amp; Verify</text>
    <text x="20" y="106" fill="#a2b39b" font-size="13" class="sans">PP-OCRv5 Mobile inference</text>
    <text x="20" y="128" fill="#a2b39b" font-size="13" class="sans">CTC timing &amp; glyph check</text>
    <text x="20" y="156" fill="#6f826a" font-size="11.5" class="mono">Pixel valley projection</text>
  </g>

  <line x1="864" y1="153" x2="926" y2="153" stroke="url(#ebeam3)" stroke-width="2.2" class="flow"/>
  <circle cx="895" cy="153" r="4" fill="#cf7661" class="node-pulse"/>

  <g transform="translate(926, 66)">
    <rect x="0" y="0" width="230" height="174" rx="12" fill="#1b241d" stroke="rgba(207,118,97,0.38)" stroke-width="1"/>
    <text x="20" y="34" fill="#cf7661" font-size="12" letter-spacing="1.5" class="mono">04 · OVERLAY</text>
    <text x="20" y="72" fill="#eff4ea" font-size="21" class="serif">In-Place Replace</text>
    <text x="20" y="106" fill="#c7b8b3" font-size="13" class="sans">OpenCC twp → cn phrases</text>
    <text x="20" y="128" fill="#c7b8b3" font-size="13" class="sans">Sampled paper &amp; ink tones</text>
    <text x="20" y="156" fill="#a5796e" font-size="11.5" class="mono">SVG reader / PNG·JPEG</text>
  </g>
</svg>
