<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-label="繁简旁注：本地离线繁体书页识别与原位简体替换">
  <defs>
    <linearGradient id="bg-zh" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111a15"/>
      <stop offset="55%" stop-color="#15211b"/>
      <stop offset="100%" stop-color="#192820"/>
    </linearGradient>
    <radialGradient id="glow-zh" cx="960" cy="180" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#aec79a" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#285745" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#121b16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan-zh" x1="840" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cf7661" stop-opacity="0"/>
      <stop offset="50%" stop-color="#cf7661" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#cf7661" stop-opacity="0"/>
    </linearGradient>
    <style>
      .serif { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif CN", Georgia, serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 5.5s ease-in-out infinite; }
      .scanline { animation: sweep 4.8s ease-in-out infinite; }
      .pulse-a { animation: swapFadeA 4.8s ease-in-out infinite; }
      .pulse-b { animation: swapFadeB 4.8s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { opacity: 0.72; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      @keyframes sweep {
        0% { transform: translateY(0px); opacity: 0.2; }
        20% { opacity: 0.95; }
        80% { opacity: 0.95; }
        100% { transform: translateY(188px); opacity: 0.2; }
      }
      @keyframes swapFadeA {
        0%, 36% { opacity: 0.92; }
        50%, 86% { opacity: 0.24; }
        100% { opacity: 0.92; }
      }
      @keyframes swapFadeB {
        0%, 36% { opacity: 0.28; }
        50%, 86% { opacity: 1; }
        100% { opacity: 0.28; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="20" fill="url(#bg-zh)" stroke="rgba(174,199,154,0.22)" stroke-width="1.5"/>
  <rect x="14" y="14" width="1172" height="332" rx="14" fill="none" stroke="rgba(174,199,154,0.08)" stroke-width="1"/>
  <circle cx="965" cy="180" r="320" fill="url(#glow-zh)" class="breathe"/>

  <!-- Left Seal & Title -->
  <rect x="64" y="54" width="44" height="44" rx="5" fill="rgba(207,118,97,0.08)" stroke="#cf7661" stroke-width="1.4"/>
  <text x="86" y="85" text-anchor="middle" fill="#cf7661" font-size="22" class="serif">閱</text>

  <text x="126" y="73" fill="#e3ebdd" font-size="21" letter-spacing="3" class="serif">繁简旁注</text>
  <text x="126" y="95" fill="#8ea188" font-size="11.5" letter-spacing="2.4" class="mono">FANJIAN NOTES · LOCAL PWA</text>

  <!-- Headline & Copy -->
  <text x="64" y="168" fill="#f3f6ee" font-size="44" letter-spacing="4" class="serif">展卷见繁，落目成简。</text>
  <text x="64" y="216" fill="#a8b8a0" font-size="16" letter-spacing="0.8" class="sans">离线识别繁体书页，自动 3D 展平弯曲与倾角，以原纸底色及墨色原位覆盖简体</text>

  <!-- Feature Pills -->
  <g transform="translate(64, 256)">
    <rect x="0" y="0" width="144" height="36" rx="18" fill="rgba(174,199,154,0.10)" stroke="rgba(174,199,154,0.3)" stroke-width="1"/>
    <circle cx="20" cy="18" r="3.5" fill="#9bc286"/>
    <text x="33" y="23" fill="#d9e5cf" font-size="13" class="sans">100% 本地离线</text>

    <rect x="160" y="0" width="156" height="36" rx="18" fill="rgba(174,199,154,0.10)" stroke="rgba(174,199,154,0.3)" stroke-width="1"/>
    <circle cx="180" cy="18" r="3.5" fill="#9bc286"/>
    <text x="193" y="23" fill="#d9e5cf" font-size="13" class="sans">UVDoc 3D 展平</text>

    <rect x="332" y="0" width="154" height="36" rx="18" fill="rgba(207,118,97,0.12)" stroke="rgba(207,118,97,0.34)" stroke-width="1"/>
    <circle cx="352" cy="18" r="3.5" fill="#cf7661"/>
    <text x="365" y="23" fill="#ebd2cb" font-size="13" class="sans">同色原位覆盖</text>
  </g>

  <!-- Right Bookplate Showcase -->
  <g transform="translate(830, 44)">
    <rect x="0" y="0" width="302" height="272" rx="12" fill="#17231c" stroke="rgba(174,199,154,0.28)" stroke-width="1"/>
    <rect x="9" y="9" width="284" height="254" rx="8" fill="none" stroke="rgba(174,199,154,0.12)" stroke-width="1"/>

    <text x="28" y="34" fill="#8ea188" font-size="11" letter-spacing="1.8" class="mono">IN-PLACE REPLACEMENT</text>
    <line x1="28" y1="46" x2="274" y2="46" stroke="rgba(174,199,154,0.16)" stroke-width="1"/>

    <!-- Traditional column (left) -->
    <text x="86" y="72" text-anchor="middle" fill="#7c8f78" font-size="12" class="sans">识别原字</text>
    <g class="pulse-a serif" fill="#9eb098" font-size="34" text-anchor="middle">
      <text x="86" y="122">繁</text>
      <text x="86" y="176">書</text>
      <text x="86" y="230">頁</text>
    </g>

    <!-- Arrows -->
    <g stroke="#78926d" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M132 110 L168 110 M162 105 L168 110 L162 115"/>
      <path d="M132 164 L168 164 M162 159 L168 164 L162 169"/>
      <path d="M132 218 L168 218 M162 213 L168 218 L162 223"/>
    </g>

    <!-- Simplified replacement chips (right) -->
    <text x="216" y="72" text-anchor="middle" fill="#cf7661" font-size="12" class="sans">原位覆简</text>
    <g class="pulse-b">
      <rect x="190" y="88" width="52" height="44" rx="6" fill="#233429" stroke="rgba(174,199,154,0.35)" stroke-width="1"/>
      <rect x="190" y="142" width="52" height="44" rx="6" fill="#233429" stroke="rgba(174,199,154,0.35)" stroke-width="1"/>
      <rect x="190" y="196" width="52" height="44" rx="6" fill="#233429" stroke="rgba(174,199,154,0.35)" stroke-width="1"/>
      <g class="serif" fill="#eef4e6" font-size="32" text-anchor="middle">
        <text x="216" y="121">简</text>
        <text x="216" y="175">书</text>
        <text x="216" y="229">页</text>
      </g>
    </g>

    <!-- Animated scanning beam -->
    <line x1="22" y1="58" x2="280" y2="58" stroke="url(#scan-zh)" stroke-width="2" class="scanline"/>
  </g>
</svg>
