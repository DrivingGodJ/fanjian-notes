name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_BASE_PATH: /fanjian-notes/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and core algorithms
        run: |
          pnpm run typecheck
          pnpm test
      - name: Restore verified official model archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public/ocr/det.tar
            public/ocr/rec.tar
            public/ocr/uvdoc.tar
          key: ppocr-v5-mobile-0.4.2-78105604-f7e792bc-uvdoc-8b46701b
          restore-keys: ppocr-v5-mobile-0.4.2-78105604-f7e792bc
      - name: Build application and official OCR assets
        run: pnpm build
      - name: Prepare browser and Chinese test fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pnpm exec playwright install --with-deps chromium
      - name: Verify interactions and real offline OCR under the Pages path
        run: pnpm run test:e2e
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload static application including models
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
